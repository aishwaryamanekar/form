<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Form</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      width: 300px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      color: white;
      animation: fadeIn 1s ease-in-out;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0072ff;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);} 
      to { opacity: 1; transform: translateY(0);} 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Contact Form</h2>
    <input type="text" id="name" placeholder="Enter Name" />
    <input type="tel" id="phone" placeholder="Enter Phone" />
    <button onclick="submitData()">Submit</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
    const SUPABASE_URL = "https://golqinvkqinvpvesropb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbHFpbnZrcWludnB2ZXNyb3BiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MjI0NzcsImV4cCI6MjA5MDE5ODQ3N30.wXu4UZ_XYyYt4nS6LHo70mLgFk75iJRdTy_1QuzaY4c";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function submitData() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;

      const { data, error } = await client
        .from('contacts')
        .insert([{ name: name, phone: phone }]);

      if (error) {
        alert("Error saving data");
        console.log(error);
      } else {
        alert("Saved successfully!");
      }
    }
  </script>

</body>
</html>
